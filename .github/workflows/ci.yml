name: Node CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional jest test path/name filter'
        required: false
        default: ''

concurrency:
  # Note that the `teardown-pr-preview` workflow needs the same group name
  # to cancel the running `ci` workflows
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        node-version: [18.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Cache node modules
        id: cache-dep
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-dep.outputs.cache-hit != 'true'
        run: npm ci

      - name: Unit Test
        run: npm run test -- ${{ inputs.test-filter }}

      - name: Build release
        run: npm run release

      - name: Pack npm tarball
        if: ${{ matrix.node-version == '22.x' }}
        id: pack-tarball
        run: |
          export PR_PREVIEW_DIR='echarts-pr-preview'
          mkdir -p $PR_PREVIEW_DIR
          npm pack --pack-destination $PR_PREVIEW_DIR
          echo "PR_PREVIEW_DIR=$PR_PREVIEW_DIR" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        if: ${{ steps.pack-tarball.outcome == 'success' }}
        with:
          name: npm-tarball
          path: ${{ env.PR_PREVIEW_DIR }}/*.tgz
          retention-days: 1
          if-no-files-found: error
